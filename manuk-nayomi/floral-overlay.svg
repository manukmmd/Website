<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
<title id="title">Ivory wedding flowers with apricot and peach accents</title>
<desc id="desc">Romantic floral illustration of white blossoms, soft peach flowers, champagne stems and restrained greenery on a warm ivory background.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5e6d8"/><stop offset=".55" stop-color="#fff8ee"/><stop offset="1" stop-color="#f2e2d3"/></linearGradient>
  <radialGradient id="whitePetal" cx=".32" cy=".22" r=".9"><stop stop-color="#fffefa"/><stop offset=".54" stop-color="#fffaf3"/><stop offset=".87" stop-color="#eddfd5"/><stop offset="1" stop-color="#dbc7b7"/></radialGradient>
  <radialGradient id="peachPetal" cx=".35" cy=".25" r=".95"><stop stop-color="#fff4e7"/><stop offset=".5" stop-color="#f5c9aa"/><stop offset=".88" stop-color="#dfa780"/><stop offset="1" stop-color="#c58f72"/></radialGradient>
  <radialGradient id="apricotPetal" cx=".35" cy=".25" r=".85"><stop stop-color="#fbe0bd"/><stop offset=".48" stop-color="#ebae82"/><stop offset=".88" stop-color="#ce8b64"/><stop offset="1" stop-color="#ac745a"/></radialGradient>
  <radialGradient id="centre"><stop stop-color="#f7e9bf"/><stop offset=".72" stop-color="#caae76"/><stop offset="1" stop-color="#b88b56"/></radialGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a2ae91"/><stop offset=".55" stop-color="#87977b"/><stop offset="1" stop-color="#657768"/></linearGradient>
  <linearGradient id="darkLeaf" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8e9b7d"/><stop offset="1" stop-color="#627965"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  <g id="flower-white">
    <ellipse cx="0" cy="-45" rx="28" ry="56" fill="url(#whitePetal)" stroke="#dfcabe" stroke-width=".7"/>
    <ellipse cx="0" cy="-45" rx="28" ry="56" fill="url(#whitePetal)" stroke="#dfcabe" stroke-width=".7" transform="rotate(45)"/>
    <ellipse cx="0" cy="-45" rx="28" ry="56" fill="url(#whitePetal)" stroke="#dfcabe" stroke-width=".7" transform="rotate(90)"/>
    <ellipse cx="0" cy="-45" rx="28" ry="56" fill="url(#whitePetal)" stroke="#dfcabe" stroke-width=".7" transform="rotate(135)"/>
    <ellipse cx="0" cy="-45" rx="28" ry="56" fill="url(#whitePetal)" stroke="#dfcabe" stroke-width=".7" transform="rotate(180)"/>
    <ellipse cx="0" cy="-45" rx="28" ry="56" fill="url(#whitePetal)" stroke="#dfcabe" stroke-width=".7" transform="rotate(225)"/>
    <ellipse cx="0" cy="-45" rx="28" ry="56" fill="url(#whitePetal)" stroke="#dfcabe" stroke-width=".7" transform="rotate(270)"/>
    <ellipse cx="0" cy="-45" rx="28" ry="56" fill="url(#whitePetal)" stroke="#dfcabe" stroke-width=".7" transform="rotate(315)"/>
    <circle r="24" fill="url(#centre)" opacity=".9"/><circle r="13" fill="#e3c695"/>
    <g stroke="#b48b54" stroke-width="1.5" stroke-linecap="round"><path d="M-7 0l-5 -9M7 0l8 -8M0 9l1 10M-3 -5l-2 -13M11 6l13 4"/></g>
    <g fill="#fff7d1"><circle cx="-12" cy="-9" r="3"/><circle cx="15" cy="-8" r="3"/><circle cx="1" cy="18" r="3"/><circle cx="-5" cy="-17" r="3"/><circle cx="24" cy="10" r="3"/></g>
  </g>
  <g id="flower-peach">
    <ellipse cx="0" cy="-39" rx="24" ry="50" fill="url(#peachPetal)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-39" rx="24" ry="50" fill="url(#peachPetal)" transform="rotate(51)"/>
    <ellipse cx="0" cy="-39" rx="24" ry="50" fill="url(#peachPetal)" transform="rotate(102)"/>
    <ellipse cx="0" cy="-39" rx="24" ry="50" fill="url(#peachPetal)" transform="rotate(153)"/>
    <ellipse cx="0" cy="-39" rx="24" ry="50" fill="url(#peachPetal)" transform="rotate(204)"/>
    <ellipse cx="0" cy="-39" rx="24" ry="50" fill="url(#peachPetal)" transform="rotate(255)"/>
    <ellipse cx="0" cy="-39" rx="24" ry="50" fill="url(#peachPetal)" transform="rotate(306)"/>
    <circle r="21" fill="url(#centre)"/><circle r="10" fill="#f4dbad"/>
  </g>
  <g id="flower-apricot">
    <ellipse cx="0" cy="-33" rx="23" ry="45" fill="url(#apricotPetal)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-33" rx="23" ry="45" fill="url(#apricotPetal)" transform="rotate(60)"/>
    <ellipse cx="0" cy="-33" rx="23" ry="45" fill="url(#apricotPetal)" transform="rotate(120)"/>
    <ellipse cx="0" cy="-33" rx="23" ry="45" fill="url(#apricotPetal)" transform="rotate(180)"/>
    <ellipse cx="0" cy="-33" rx="23" ry="45" fill="url(#apricotPetal)" transform="rotate(240)"/>
    <ellipse cx="0" cy="-33" rx="23" ry="45" fill="url(#apricotPetal)" transform="rotate(300)"/>
    <circle r="16" fill="#f4d9a4"/><circle r="8" fill="#c7a46f"/>
  </g>
  <g id="leaf-pair">
    <path d="M0 0Q-42 -64 -7 -95Q34 -66 0 0Z" fill="url(#leaf)" opacity=".9"/>
    <path d="M0 0Q33 -54 77 -45Q71 -5 0 0Z" fill="url(#darkLeaf)" opacity=".88"/>
    <path d="M0 0L-8 -77M0 0L57 -35" stroke="#e0dfcb" stroke-width="1.4" opacity=".64"/>
  </g>
  <g id="sprig">
    <path d="M0 0Q35 -60 48 -144" fill="none" stroke="#84937a" stroke-width="3"/>
    <path d="M22 -48Q-14 -80 8 -111Q41 -98 22 -48ZM35 -78Q68 -129 100 -113Q75 -81 35 -78ZM42 -114Q0 -164 26 -182Q58 -158 42 -114Z" fill="url(#leaf)" opacity=".86"/>
  </g>
</defs>
<!-- Upper right bouquet: elegant ivory flowers first, with small peach accents -->
